name: Feature request
description: Suggest an improvement to ENMON's monitoring, control, or operator workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What operational need is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want, not just the implementation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you already thought about
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Controller UX
        - Display UX
        - Pocket UX
        - Networking / adoption
        - Updater / rollout
        - Documentation
        - Peripheral support
        - Other
    validations:
      required: true
